name: Sincronizar catálogo autorizado
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    if: vars.CATALOG_AUTHORIZED == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sincronizar
        env:
          CATALOG_AUTHORIZED: ${{ vars.CATALOG_AUTHORIZED }}
          CATALOG_SOURCE_URL: ${{ vars.CATALOG_SOURCE_URL }}
        run: python scripts/sync_catalog.py
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json
          git diff --cached --quiet || (git commit -m 'Actualizar catálogo' && git push)
